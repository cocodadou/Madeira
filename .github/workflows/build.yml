name: Build Madeira

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Madeira
    runs-on: macos-15

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          xcode-select -p

      - name: Install build dependencies
        run: |
          brew update

          brew install \
            cmake \
            ninja \
            pkg-config \
            python@3.13 \
            meson \
            nasm \
            autoconf \
            automake \
            libtool \
            bison \
            flex \
            gettext \
            gnu-sed

      - name: Configure git
        run: |
          git config --global protocol.version 2
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Show repository state
        run: |
          git status --short
          git submodule status --recursive

      - name: Make build scripts executable
        run: |
          find build -type f -name "*.sh" -exec chmod +x {} \;

      - name: Build native components
        shell: bash
        run: |
          set -euxo pipefail

          for script in build/*/build.sh; do
            if [ -f "$script" ]; then
              echo "========================================"
              echo "Building: $script"
              echo "========================================"

              (
                cd "$(dirname "$script")"
                ./build.sh
              )
            fi
          done

      - name: Build Madeira
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate application bundle
        shell: bash
        run: |
          set -euxo pipefail

          find . \
            -type d \
            -name "*.app" \
            -not -path "./.git/*" \
            -print

      - name: Package application
        shell: bash
        run: |
          set -euxo pipefail

          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData \
            -type d \
            -path "*/Build/Products/Release-iphoneos/*.app" \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "Could not find the built .app bundle."
            exit 1
          fi

          mkdir -p artifacts
          ditto "$APP_PATH" "artifacts/Madeira.app"

          cd artifacts
          zip -r Madeira-ios.zip Madeira.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Madeira-ios
          path: artifacts/Madeira-ios.zip
          if-no-files-found: error
