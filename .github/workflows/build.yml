name: Build Madeira

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: madeira-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Madeira iOS
    runs-on: macos-15

    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      IOS_DEPLOYMENT_TARGET: "17.0"
      LLVM_MINGW_VERSION: "20260421"
      LLVM_MINGW_NAME: "llvm-mingw-20260421-ucrt-macos-universal"

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

          echo "Xcode:"
          xcodebuild -version

          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Homebrew dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            autoconf \
            automake \
            bison \
            cmake \
            flex \
            gettext \
            libtool \
            llvm \
            meson \
            nasm \
            ninja \
            pkg-config \
            python@3.13

          BISON_BIN="$(brew --prefix bison)/bin"
          FLEX_BIN="$(brew --prefix flex)/bin"
          LLVM_BIN="$(brew --prefix llvm)/bin"

          echo "${BISON_BIN}" >> "${GITHUB_PATH}"
          echo "${FLEX_BIN}" >> "${GITHUB_PATH}"
          echo "${LLVM_BIN}" >> "${GITHUB_PATH}"

      - name: Cache LLVM MinGW
        id: llvm-mingw-cache
        uses: actions/cache@v4
        with:
          path: toolchains/${{ env.LLVM_MINGW_NAME }}
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos-arm64

      - name: Install LLVM MinGW
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchains/${LLVM_MINGW_NAME}"
          TOOLCHAIN_ARCHIVE="${GITHUB_WORKSPACE}/toolchains/${LLVM_MINGW_NAME}.tar.xz"

          mkdir -p "${GITHUB_WORKSPACE}/toolchains"

          if [ ! -x "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang" ]; then
            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-all-errors \
              --show-error \
              --output "${TOOLCHAIN_ARCHIVE}" \
              "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_NAME}.tar.xz"

            tar \
              --extract \
              --xz \
              --file "${TOOLCHAIN_ARCHIVE}" \
              --directory "${GITHUB_WORKSPACE}/toolchains"

            rm -f "${TOOLCHAIN_ARCHIVE}"
          fi

          test -x "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang"
          test -x "${TOOLCHAIN_DIR}/bin/x86_64-w64-mingw32-clang"
          test -x "${TOOLCHAIN_DIR}/bin/ld.lld"

          echo "${TOOLCHAIN_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Build environment
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchains/${LLVM_MINGW_NAME}"
          BISON_BIN="$(brew --prefix bison)/bin"
          FLEX_BIN="$(brew --prefix flex)/bin"
          LLVM_BIN="$(brew --prefix llvm)/bin"

          echo "BISON_BIN=${BISON_BIN}" >> "${GITHUB_ENV}"
          echo "FLEX_BIN=${FLEX_BIN}" >> "${GITHUB_ENV}"
          echo "LLVM_BIN=${LLVM_BIN}" >> "${GITHUB_ENV}"
          echo "LLVM_MINGW=${TOOLCHAIN_DIR}" >> "${GITHUB_ENV}"

          {
            echo "PATH=${BISON_BIN}:${FLEX_BIN}:${LLVM_BIN}:${TOOLCHAIN_DIR}/bin:${PATH}"
          } >> "${GITHUB_ENV}"

          echo "Toolchain:"
          "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang" --version
          "${TOOLCHAIN_DIR}/bin/x86_64-w64-mingw32-clang" --version
          "${TOOLCHAIN_DIR}/bin/ld.lld" --version

          echo "Native LLVM:"
          "${LLVM_BIN}/clang" --version
          "${LLVM_BIN}/llvm-objcopy" --version
          "${LLVM_BIN}/llvm-ar" --version

          echo "Autotools:"
          "${BISON_BIN}/bison" --version
          "${FLEX_BIN}/flex" --version

      - name: Prepare Wine source tree
        shell: bash
        run: |
          set -euo pipefail

          test -f wine/configure
          test -f wine/dlls/ntdll/unix/sync.c

          mkdir -p wine/build-macos

      - name: Configure and build Wine macOS host
        shell: bash
        working-directory: wine
        run: |
          set -euo pipefail

          REPO_ROOT="${GITHUB_WORKSPACE}"
          BUILD_DIR="${REPO_ROOT}/wine/build-macos"
          SHIMS_DIR="${REPO_ROOT}/build/ntdll-unix/shims"
          TOOLCHAIN_DIR="${REPO_ROOT}/toolchains/${LLVM_MINGW_NAME}"

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${LLVM_BIN}:\
          ${TOOLCHAIN_DIR}/bin:\
          ${PATH}"

          export CPPFLAGS="-I${SHIMS_DIR}"

          cd "${BUILD_DIR}"

          if [ ! -f Makefile ]; then
            ../configure \
              --enable-win64 \
              --with-mingw \
              CC="${LLVM_BIN}/clang" \
              CXX="${LLVM_BIN}/clang++" \
              AR="${LLVM_BIN}/llvm-ar" \
              RANLIB="${LLVM_BIN}/llvm-ranlib" \
              DLLTOOL="${LLVM_BIN}/llvm-dlltool" \
              STRIP="${LLVM_BIN}/llvm-strip" \
              CPPFLAGS="${CPPFLAGS}"
          fi

      - name: Build Wine host binaries
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchains/${LLVM_MINGW_NAME}"

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${LLVM_BIN}:\
          ${TOOLCHAIN_DIR}/bin:\
          ${PATH}"

          cd wine/build-macos

          make -j"$(sysctl -n hw.ncpu)" \
            wine \
            server/libwineserver.a \
            tools/winebuild/winebuild \
            tools/winegcc/winegcc \
            dlls/d3dcompiler_47/d3dcompiler_47.dll

      - name: Install Wine base library
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/Madeira

          cp \
            wine/build-macos/server/libwineserver.a \
            app/Madeira/libwineserver.a

      - name: Prepare generated iOS support
        shell: bash
        run: |
          set -euo pipefail

          test -d build/ntdll-unix
          test -d build/ntdll-unix/shims
          test -f build/ntdll-unix/build.sh

          chmod +x build/ntdll-unix/build.sh
          chmod +x build/wineserver/build.sh
          chmod +x build/win32u-unix/build.sh
          chmod +x build/dxmt-ios/build.sh
          chmod +x build/d3d11-triangle/build.sh

      - name: Build ntdll Unix layer
        shell: bash
        run: |
          set -euo pipefail

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          ${PATH}"

          ./build/ntdll-unix/build.sh

      - name: Build wineserver iOS layer
        shell: bash
        run: |
          set -euo pipefail

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          ${PATH}"

          ./build/wineserver/build.sh

      - name: Build win32u Unix layer
        shell: bash
        run: |
          set -euo pipefail

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          ${PATH}"

          ./build/win32u-unix/build.sh

      - name: Build DXMT iOS layer
        shell: bash
        run: |
          set -euo pipefail

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          ${PATH}"

          ./build/dxmt-ios/build.sh

      - name: Build D3D11 triangle assets
        shell: bash
        env:
          WINE: ${{ github.workspace }}/wine/build-macos/wine
        run: |
          set -euo pipefail

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          ${PATH}"

          test -x "${WINE}"
          test -x "${GITHUB_WORKSPACE}/wine/build-macos/tools/winebuild/winebuild"
          test -f "${GITHUB_WORKSPACE}/wine/build-macos/dlls/d3dcompiler_47/d3dcompiler_47.dll"

          ./build/d3d11-triangle/build.sh

      - name: Prepare Xcode build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/DerivedData

          if [ -f app/Madeira.xcodeproj/project.pbxproj ]; then
            echo "Using app/Madeira.xcodeproj"
          else
            PROJECT="$(find app -maxdepth 2 -name "*.xcodeproj" -print -quit)"

            if [ -z "${PROJECT}" ]; then
              echo "No Madeira Xcode project found."
              exit 1
            fi

            echo "Using ${PROJECT}"
          fi

      - name: Build Madeira
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="app/Madeira.xcodeproj"

          if [ ! -d "${PROJECT}" ]; then
            PROJECT="$(find app -maxdepth 2 -name "*.xcodeproj" -print -quit)"
          fi

          if [ -z "${PROJECT}" ]; then
            echo "No Madeira Xcode project found."
            exit 1
          fi

          xcodebuild \
            -project "${PROJECT}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${GITHUB_WORKSPACE}/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate Madeira.app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(
            find "${GITHUB_WORKSPACE}/build/DerivedData" \
              -type d \
              -path "*/Build/Products/Release-iphoneos/*.app" \
              -print \
              -quit
          )"

          if [ -z "${APP_PATH}" ]; then
            APP_PATH="$(
              find "${GITHUB_WORKSPACE}/app" \
                -type d \
                -path "*/Build/Products/Release-iphoneos/*.app" \
                -print \
                -quit
            )"
          fi

          if [ -z "${APP_PATH}" ]; then
            echo "Madeira.app was not produced."
            exit 1
          fi

          echo "app_path=${APP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts/Payload

          cp -R \
            "${{ steps.app.outputs.app_path }}" \
            artifacts/Payload/Madeira.app

          cd artifacts
          zip -qry Madeira-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Madeira-iOS
          path: artifacts/Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
