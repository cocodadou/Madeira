name: Build Madeira

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: madeira-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Madeira iOS
    runs-on: macos-15

    env:
      IOS_DEPLOYMENT_TARGET: "17.0"
      LLVM_MINGW_VERSION: "20260421"
      LLVM_MINGW_NAME: "llvm-mingw-20260421-ucrt-macos-universal"

      GMP_VERSION: "6.3.0"
      NETTLE_VERSION: "3.10.1"
      GNUTLS_VERSION: "3.8.9"

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

          echo "Xcode:"
          xcodebuild -version

          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1

          brew install \
            autoconf \
            automake \
            bison \
            cmake \
            flex \
            freetype \
            gettext \
            glib \
            gst-plugins-base \
            gstreamer \
            harfbuzz \
            libtool \
            llvm \
            meson \
            nasm \
            ninja \
            pkg-config \
            python@3.13

          echo "$(brew --prefix bison)/bin" >> "${GITHUB_PATH}"
          echo "$(brew --prefix flex)/bin" >> "${GITHUB_PATH}"
          echo "$(brew --prefix gettext)/bin" >> "${GITHUB_PATH}"
          echo "$(brew --prefix llvm)/bin" >> "${GITHUB_PATH}"

          echo "BISON_BIN=$(brew --prefix bison)/bin" >> "${GITHUB_ENV}"
          echo "FLEX_BIN=$(brew --prefix flex)/bin" >> "${GITHUB_ENV}"
          echo "GETTEXT_BIN=$(brew --prefix gettext)/bin" >> "${GITHUB_ENV}"
          echo "LLVM_BIN=$(brew --prefix llvm)/bin" >> "${GITHUB_ENV}"

      - name: Cache LLVM MinGW
        uses: actions/cache@v4
        with:
          path: toolchains/${{ env.LLVM_MINGW_NAME }}
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos-arm64

      - name: Install LLVM MinGW
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_ROOT="${GITHUB_WORKSPACE}/toolchains"
          TOOLCHAIN_DIR="${TOOLCHAIN_ROOT}/${LLVM_MINGW_NAME}"
          TOOLCHAIN_ARCHIVE="${TOOLCHAIN_ROOT}/${LLVM_MINGW_NAME}.tar.xz"

          mkdir -p "${TOOLCHAIN_ROOT}"

          if [ ! -x "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang" ]; then
            rm -f "${TOOLCHAIN_ARCHIVE}"

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-all-errors \
              --show-error \
              --output "${TOOLCHAIN_ARCHIVE}" \
              "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_NAME}.tar.xz"

            tar \
              --extract \
              --xz \
              --file "${TOOLCHAIN_ARCHIVE}" \
              --directory "${TOOLCHAIN_ROOT}"

            rm -f "${TOOLCHAIN_ARCHIVE}"
          fi

          test -x "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang"
          test -x "${TOOLCHAIN_DIR}/bin/x86_64-w64-mingw32-clang"
          test -x "${TOOLCHAIN_DIR}/bin/llvm-dlltool"
          test -x "${TOOLCHAIN_DIR}/bin/ld.lld"

          echo "LLVM_MINGW=${TOOLCHAIN_DIR}" >> "${GITHUB_ENV}"
          echo "${TOOLCHAIN_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Configure deterministic toolchains
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchains/${LLVM_MINGW_NAME}"

          MACOS_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          MACOS_CC="$(xcrun --sdk macosx -f clang)"
          MACOS_CXX="$(xcrun --sdk macosx -f clang++)"

          IOS_CC="$(xcrun --sdk iphoneos -f clang)"
          IOS_CXX="$(xcrun --sdk iphoneos -f clang++)"
          IOS_AR="$(xcrun --sdk iphoneos -f ar)"
          IOS_RANLIB="$(xcrun --sdk iphoneos -f ranlib)"
          IOS_STRIP="$(xcrun --sdk iphoneos -f strip)"

          BREW_FREETYPE="$(brew --prefix freetype)"
          BREW_HARFBUZZ="$(brew --prefix harfbuzz)"
          BREW_GSTREAMER="$(brew --prefix gstreamer)"
          BREW_GST_BASE="$(brew --prefix gst-plugins-base)"
          BREW_GLIB="$(brew --prefix glib)"

          PKG_CONFIG_PATH="\
          ${BREW_GSTREAMER}/lib/pkgconfig:\
          ${BREW_GST_BASE}/lib/pkgconfig:\
          ${BREW_HARFBUZZ}/lib/pkgconfig:\
          ${BREW_FREETYPE}/lib/pkgconfig:\
          ${BREW_GLIB}/lib/pkgconfig:\
          ${BREW_GSTREAMER}/share/pkgconfig:\
          ${BREW_GST_BASE}/share/pkgconfig:\
          ${BREW_HARFBUZZ}/share/pkgconfig:\
          ${BREW_FREETYPE}/share/pkgconfig:\
          ${BREW_GLIB}/share/pkgconfig"

          FONT_CFLAGS="$(
            pkg-config \
              --cflags \
              freetype2 \
              harfbuzz
          )"

          GST_CFLAGS="$(
            pkg-config \
              --cflags \
              gstreamer-1.0 \
              gstreamer-base-1.0 \
              gstreamer-audio-1.0 \
              gstreamer-video-1.0 \
              gstreamer-app-1.0 \
              gstreamer-pbutils-1.0
          )"

          IOS_COMMON_CFLAGS="\
          -arch arm64 \
          -isysroot ${IOS_SDK} \
          -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET} \
          -Wno-error \
          -Wno-deprecated-declarations"

          echo "MACOS_SDK=${MACOS_SDK}" >> "${GITHUB_ENV}"
          echo "IOS_SDK=${IOS_SDK}" >> "${GITHUB_ENV}"

          echo "MACOS_CC=${MACOS_CC}" >> "${GITHUB_ENV}"
          echo "MACOS_CXX=${MACOS_CXX}" >> "${GITHUB_ENV}"

          echo "IOS_CC=${IOS_CC}" >> "${GITHUB_ENV}"
          echo "IOS_CXX=${IOS_CXX}" >> "${GITHUB_ENV}"
          echo "IOS_AR=${IOS_AR}" >> "${GITHUB_ENV}"
          echo "IOS_RANLIB=${IOS_RANLIB}" >> "${GITHUB_ENV}"
          echo "IOS_STRIP=${IOS_STRIP}" >> "${GITHUB_ENV}"

          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> "${GITHUB_ENV}"

          echo "FONT_CFLAGS=${FONT_CFLAGS}" >> "${GITHUB_ENV}"
          echo "GST_CFLAGS=${GST_CFLAGS}" >> "${GITHUB_ENV}"
          echo "IOS_COMMON_CFLAGS=${IOS_COMMON_CFLAGS}" >> "${GITHUB_ENV}"

          echo "WINEBUILD=${GITHUB_WORKSPACE}/wine/build-macos/tools/winebuild/winebuild" >> "${GITHUB_ENV}"
          echo "WINEGCC=${GITHUB_WORKSPACE}/wine/build-macos/tools/winegcc/winegcc" >> "${GITHUB_ENV}"

          echo "LLVM_MINGW=${TOOLCHAIN_DIR}" >> "${GITHUB_ENV}"

      - name: Verify toolchain dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "Apple Clang:"
          echo "${IOS_CC}"
          "${IOS_CC}" --version

          echo
          echo "Apple Clang++:"
          echo "${IOS_CXX}"
          "${IOS_CXX}" --version

          echo
          echo "Bison:"
          bison --version

          echo
          echo "Flex:"
          flex --version

          echo
          echo "pkg-config:"
          pkg-config --version

          echo
          echo "FreeType:"
          pkg-config --modversion freetype2

          echo
          echo "HarfBuzz:"
          pkg-config --modversion harfbuzz

          echo
          echo "GStreamer:"
          pkg-config --modversion gstreamer-1.0

          echo
          echo "LLVM-MinGW AArch64:"
          "${LLVM_MINGW}/bin/aarch64-w64-mingw32-clang" --version

          echo
          echo "LLVM-MinGW x86_64:"
          "${LLVM_MINGW}/bin/x86_64-w64-mingw32-clang" --version

          echo
          echo "LLVM-MinGW LLD:"
          "${LLVM_MINGW}/bin/ld.lld" --version

      - name: Prepare LLVM headers for DXMT
        shell: bash
        run: |
          set -euo pipefail

          LLVM_PREFIX="$(brew --prefix llvm)"
          LLVM_SOURCE_INCLUDE="${LLVM_PREFIX}/include"
          LLVM_GENERATED_INCLUDE="$("${LLVM_PREFIX}/bin/llvm-config" --includedir)"

          mkdir -p \
            "${GITHUB_WORKSPACE}/toolchains/llvm-project/llvm" \
            "${GITHUB_WORKSPACE}/toolchains/llvm-ios-build"

          rm -rf \
            "${GITHUB_WORKSPACE}/toolchains/llvm-project/llvm/include" \
            "${GITHUB_WORKSPACE}/toolchains/llvm-ios-build/include"

          ln -s \
            "${LLVM_SOURCE_INCLUDE}" \
            "${GITHUB_WORKSPACE}/toolchains/llvm-project/llvm/include"

          ln -s \
            "${LLVM_GENERATED_INCLUDE}" \
            "${GITHUB_WORKSPACE}/toolchains/llvm-ios-build/include"

          test -f \
            "${GITHUB_WORKSPACE}/toolchains/llvm-project/llvm/include/llvm/ADT/StringRef.h"

      - name: Prepare FreeType
        shell: bash
        run: |
          set -euo pipefail

          FREETYPE_DIR="${GITHUB_WORKSPACE}/research/freetype"

          if [ ! -f "${FREETYPE_DIR}/CMakeLists.txt" ]; then
            rm -rf "${FREETYPE_DIR}"

            git clone \
              --depth 1 \
              --branch VER-2-13-3 \
              https://github.com/freetype/freetype.git \
              "${FREETYPE_DIR}"
          fi

          test -f "${FREETYPE_DIR}/CMakeLists.txt"

      - name: Build FreeType for iOS
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/freetype-ios/build.sh
          ./build/freetype-ios/build.sh

          test -f build/freetype-ios/build/libfreetype.a

      - name: Prepare GnuTLS sources
        shell: bash
        run: |
          set -euo pipefail

          SRC_DIR="${GITHUB_WORKSPACE}/build/gnutls-ios/src"

          mkdir -p "${SRC_DIR}"

          download() {
            local url="$1"
            local output="$2"

            if [ ! -s "${SRC_DIR}/${output}" ]; then
              curl \
                --fail \
                --location \
                --retry 5 \
                --retry-all-errors \
                --show-error \
                --output "${SRC_DIR}/${output}" \
                "${url}"
            fi

            test -s "${SRC_DIR}/${output}"
          }

          download \
            "https://ftp.gnu.org/gnu/gmp/gmp-${GMP_VERSION}.tar.xz" \
            "gmp-${GMP_VERSION}.tar.xz"

          download \
            "https://ftp.gnu.org/gnu/nettle/nettle-${NETTLE_VERSION}.tar.gz" \
            "nettle-${NETTLE_VERSION}.tar.gz"

          download \
            "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-${GNUTLS_VERSION}.tar.xz" \
            "gnutls-${GNUTLS_VERSION}.tar.xz"

      - name: Build GnuTLS for iOS
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/gnutls-ios/build.sh
          ./build/gnutls-ios/build.sh

          test -f toolchains/gnutls-ios/lib/libgmp.a
          test -f toolchains/gnutls-ios/lib/libnettle.a
          test -f toolchains/gnutls-ios/lib/libhogweed.a
          test -f toolchains/gnutls-ios/lib/libgnutls.a

      - name: Prepare Wine Madeira headers
        shell: bash
        run: |
          set -euo pipefail

          SHIMS_DIR="${GITHUB_WORKSPACE}/build/ntdll-unix/shims"
          WINE_NTDLL_UNIX="${GITHUB_WORKSPACE}/wine/dlls/ntdll/unix"
          WINE_SERVER="${GITHUB_WORKSPACE}/wine/server"

          test -d "${SHIMS_DIR}"
          test -d "${WINE_NTDLL_UNIX}"
          test -d "${WINE_SERVER}"

          for header in "${SHIMS_DIR}"/*.h; do
            name="$(basename "${header}")"

            ln -sfn \
              "${header}" \
              "${WINE_NTDLL_UNIX}/${name}"

            ln -sfn \
              "${header}" \
              "${WINE_SERVER}/${name}"
          done

          test -e "${WINE_NTDLL_UNIX}/ios_srv_stats.h"
          test -e "${WINE_SERVER}/ios_fastsync.h"

      - name: Configure Wine host tools
        shell: bash
        run: |
          set -euo pipefail

          rm -rf wine/build-macos
          mkdir -p wine/build-macos

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${GETTEXT_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          /opt/homebrew/bin:\
          /usr/bin:\
          ${PATH}"

          export MACOSX_DEPLOYMENT_TARGET=15.0

          cd wine/build-macos

          ../configure \
            --enable-win64 \
            --with-mingw \
            CC="${MACOS_CC}" \
            CXX="${MACOS_CXX}" \
            AR="/usr/bin/ar" \
            RANLIB="/usr/bin/ranlib" \
            STRIP="/usr/bin/strip" \
            DLLTOOL="${LLVM_MINGW}/bin/llvm-dlltool"

          test -f Makefile
          test -f include/config.h

      - name: Build Wine host tools
        shell: bash
        run: |
          set -euo pipefail

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${GETTEXT_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          /opt/homebrew/bin:\
          /usr/bin:\
          ${PATH}"

          export MACOSX_DEPLOYMENT_TARGET=15.0

          cd wine/build-macos

          make -j"$(sysctl -n hw.ncpu)" \
            tools/makedep \
            tools/winebuild/winebuild \
            tools/winegcc/winegcc \
            dlls/d3dcompiler_47 \
            wine

          test -x tools/winebuild/winebuild
          test -x tools/winegcc/winegcc
          test -x wine

      - name: Build ntdll Unix iOS
        shell: bash
        run: |
          set -euo pipefail

          unset MACOSX_DEPLOYMENT_TARGET

          export CC="${IOS_CC}"
          export CXX="${IOS_CXX}"
          export CPP="${IOS_CC} -E"
          export AR="${IOS_AR}"
          export RANLIB="${IOS_RANLIB}"
          export STRIP="${IOS_STRIP}"

          export SDKROOT="${IOS_SDK}"
          export IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}"

          export CFLAGS="\
          ${IOS_COMMON_CFLAGS} \
          ${FONT_CFLAGS} \
          ${GST_CFLAGS} \
          -I${GITHUB_WORKSPACE}/research/freetype/include \
          -I${GITHUB_WORKSPACE}/build/ntdll-unix/shims \
          -I${GITHUB_WORKSPACE}/wine/include"

          export CPPFLAGS="${CFLAGS}"

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${GETTEXT_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          /usr/bin:\
          ${PATH}"

          chmod +x build/ntdll-unix/build.sh

          ./build/ntdll-unix/build.sh

          test -f app/Madeira/libntdll_unix.a

      - name: Build wineserver iOS
        shell: bash
        run: |
          set -euo pipefail

          unset MACOSX_DEPLOYMENT_TARGET

          export CC="${IOS_CC}"
          export CXX="${IOS_CXX}"
          export AR="${IOS_AR}"
          export RANLIB="${IOS_RANLIB}"
          export STRIP="${IOS_STRIP}"

          export SDKROOT="${IOS_SDK}"
          export IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}"

          export CFLAGS="\
          ${IOS_COMMON_CFLAGS} \
          ${GST_CFLAGS} \
          -I${GITHUB_WORKSPACE}/build/ntdll-unix/shims \
          -I${GITHUB_WORKSPACE}/wine/include"

          export CPPFLAGS="${CFLAGS}"

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${GETTEXT_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          /usr/bin:\
          ${PATH}"

          chmod +x build/wineserver/build.sh
          ./build/wineserver/build.sh

          test -f app/Madeira/libwineserver.a

      - name: Build win32u Unix iOS
        shell: bash
        run: |
          set -euo pipefail

          unset MACOSX_DEPLOYMENT_TARGET

          export CC="${IOS_CC}"
          export CXX="${IOS_CXX}"
          export AR="${IOS_AR}"
          export RANLIB="${IOS_RANLIB}"
          export STRIP="${IOS_STRIP}"

          export SDKROOT="${IOS_SDK}"
          export IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}"

          export CFLAGS="\
          ${IOS_COMMON_CFLAGS} \
          ${FONT_CFLAGS} \
          -I${GITHUB_WORKSPACE}/research/freetype/include \
          -I${GITHUB_WORKSPACE}/build/ntdll-unix/shims \
          -I${GITHUB_WORKSPACE}/wine/include"

          export CPPFLAGS="${CFLAGS}"

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${GETTEXT_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          /usr/bin:\
          ${PATH}"

          chmod +x build/win32u-unix/build.sh
          ./build/win32u-unix/build.sh

          test -f app/Madeira/libwin32u_unix.a

      - name: Build DXMT iOS
        shell: bash
        run: |
          set -euo pipefail

          unset MACOSX_DEPLOYMENT_TARGET

          export CC="${IOS_CC}"
          export CXX="${IOS_CXX}"
          export AR="${IOS_AR}"
          export RANLIB="${IOS_RANLIB}"
          export STRIP="${IOS_STRIP}"

          export SDKROOT="${IOS_SDK}"
          export IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}"

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${GETTEXT_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          /usr/bin:\
          ${PATH}"

          chmod +x build/dxmt-ios/build.sh
          ./build/dxmt-ios/build.sh

          test -f build/dxmt-ios/libdxmt_unix.a

      - name: Build D3D11 test assets
        shell: bash
        env:
          WINE: ${{ github.workspace }}/wine/build-macos/wine
        run: |
          set -euo pipefail

          chmod +x build/d3d11-triangle/build.sh

          test -x "${WINE}"
          test -x wine/build-macos/tools/winebuild/winebuild
          test -x wine/build-macos/tools/winegcc/winegcc

          "${WINE}" --version

          ./build/d3d11-triangle/build.sh

          test -s build/d3d11-triangle/vs.dxbc
          test -s build/d3d11-triangle/ps.dxbc
          test -s build/d3d11-triangle/vs_dxbc.h
          test -s build/d3d11-triangle/ps_dxbc.h

      - name: Locate Madeira Xcode project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${GITHUB_WORKSPACE}/app/Madeira.xcodeproj"

          if [ ! -d "${PROJECT}" ]; then
            PROJECT="$(
              find "${GITHUB_WORKSPACE}/app" \
                -maxdepth 3 \
                -type d \
                -name "*.xcodeproj" \
                -print \
                -quit
            )"
          fi

          if [ -z "${PROJECT}" ] || [ ! -d "${PROJECT}" ]; then
            echo "Madeira Xcode project not found."
            exit 1
          fi

          echo "XCODE_PROJECT=${PROJECT}" >> "${GITHUB_ENV}"

      - name: Build Madeira
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${GITHUB_WORKSPACE}/DerivedData"

          xcodebuild \
            -project "${XCODE_PROJECT}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${GITHUB_WORKSPACE}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate Madeira.app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(
            find "${GITHUB_WORKSPACE}/DerivedData" \
              -type d \
              -path "*/Build/Products/Release-iphoneos/*.app" \
              -print \
              -quit
          )"

          if [ -z "${APP_PATH}" ]; then
            echo "Madeira.app was not produced."
            exit 1
          fi

          echo "app_path=${APP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts/Payload

          cp -R \
            "${{ steps.app.outputs.app_path }}" \
            artifacts/Payload/Madeira.app

          cd artifacts

          zip \
            -qry \
            Madeira-unsigned.ipa \
            Payload

          test -s Madeira-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Madeira-iOS
          path: artifacts/Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
