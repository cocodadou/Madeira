name: Build Madeira

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Madeira
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install \
            cmake \
            ninja \
            pkg-config \
            python@3.13 \
            meson \
            nasm \
            autoconf \
            automake \
            libtool \
            bison \
            flex \
            gettext \
            llvm

      - name: Show repository state
        run: |
          git status --short
          git submodule status --recursive

      - name: Download LLVM MinGW toolchain
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN_VERSION="20260421"
          TOOLCHAIN_NAME="llvm-mingw-${TOOLCHAIN_VERSION}-ucrt-macos-universal"
          TOOLCHAIN_DIR="toolchains/${TOOLCHAIN_NAME}"
          TOOLCHAIN_ARCHIVE="${TOOLCHAIN_NAME}.tar.xz"

          mkdir -p toolchains

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --output "toolchains/${TOOLCHAIN_ARCHIVE}" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${TOOLCHAIN_VERSION}/${TOOLCHAIN_ARCHIVE}"

          tar \
            --extract \
            --xz \
            --file "toolchains/${TOOLCHAIN_ARCHIVE}" \
            --directory toolchains

          rm -f "toolchains/${TOOLCHAIN_ARCHIVE}"

          test -x "${TOOLCHAIN_DIR}/bin/x86_64-w64-mingw32-clang"
          test -x "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang"

          "${TOOLCHAIN_DIR}/bin/x86_64-w64-mingw32-clang" --version
          "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang" --version

      - name: Prepare LLVM tools
        shell: bash
        run: |
          set -euxo pipefail

          LLVM_PREFIX="$(brew --prefix llvm)"

          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"

          export PATH="${LLVM_PREFIX}/bin:$PATH"

          clang --version
          llvm-objcopy --version

      - name: Build Wine macOS tools
        shell: bash
        run: |
          set -euxo pipefail

          cd wine

          if [ ! -f build-macos/Makefile ]; then
            mkdir -p build-macos
            cd build-macos

            ../configure \
              --enable-win64 \
              --with-mingw \
              CC=clang \
              CXX=clang++
          else
            cd build-macos
          fi

          make -j"$(sysctl -n hw.ncpu)" \
            tools/winebuild/winebuild \
            tools/winegcc/winegcc \
            dlls/d3dcompiler_47/d3dcompiler_47.dll

      - name: Verify Wine build
        shell: bash
        run: |
          set -euxo pipefail

          test -x wine/build-macos/tools/winebuild/winebuild

          echo "winebuild:"
          wine/build-macos/tools/winebuild/winebuild --version || true

          echo "Wine build directory:"
          ls -la wine/build-macos/tools/winebuild

      - name: Build ntdll Unix
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build/ntdll-unix/build.sh
          ./build/ntdll-unix/build.sh

      - name: Build wineserver
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build/wineserver/build.sh
          ./build/wineserver/build.sh

      - name: Build win32u Unix
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build/win32u-unix/build.sh
          ./build/win32u-unix/build.sh

      - name: Build DXMT
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build/dxmt-ios/build.sh
          ./build/dxmt-ios/build.sh

      - name: Build D3D11 triangle
        shell: bash
        env:
          WINE: ${{ github.workspace }}/wine/build-macos/wine
        run: |
          set -euxo pipefail

          chmod +x build/d3d11-triangle/build.sh

          if [ ! -x "$WINE" ]; then
            echo "Expected Wine executable was not found:"
            echo "$WINE"
            exit 1
          fi

          "$WINE" --version

          ./build/d3d11-triangle/build.sh

      - name: Find Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          find . \
            -maxdepth 4 \
            -name "*.xcodeproj" \
            -print

      - name: Build Madeira
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="$(find . -maxdepth 4 -name "*.xcodeproj" -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "No Xcode project found."
            exit 1
          fi

          echo "Using project: $PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate application
        id: find-app
        shell: bash
        run: |
          set -euxo pipefail

          APP_PATH="$(
            find "$HOME/Library/Developer/Xcode/DerivedData" \
              -type d \
              -path "*/Build/Products/Release-iphoneos/*.app" \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "Could not find the built .app bundle."
            exit 1
          fi

          echo "Found application: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package application
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          cp -R \
            "${{ steps.find-app.outputs.app_path }}" \
            artifacts/Madeira.app

          cd artifacts
          zip -r Madeira-ios.zip Madeira.app

      - name: Upload application
        uses: actions/upload-artifact@v6
        with:
          name: Madeira-iOS
          path: artifacts/Madeira-ios.zip
          if-no-files-found: error
