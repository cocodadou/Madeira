name: Build Madeira

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Madeira
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            python@3.13 \
            meson \
            nasm \
            autoconf \
            automake \
            libtool \
            bison \
            flex \
            gettext

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Show repository state
        run: |
          git status --short
          git submodule status --recursive

      - name: Download LLVM MinGW toolchain
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN_VERSION="20260421"
          TOOLCHAIN_NAME="llvm-mingw-${TOOLCHAIN_VERSION}-ucrt-macos-universal"
          TOOLCHAIN_DIR="toolchains/${TOOLCHAIN_NAME}"
          TOOLCHAIN_ARCHIVE="${TOOLCHAIN_NAME}.tar.xz"

          mkdir -p toolchains

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --output "toolchains/${TOOLCHAIN_ARCHIVE}" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${TOOLCHAIN_VERSION}/${TOOLCHAIN_ARCHIVE}"

          tar \
            --extract \
            --xz \
            --file "toolchains/${TOOLCHAIN_ARCHIVE}" \
            --directory toolchains

          rm -f "toolchains/${TOOLCHAIN_ARCHIVE}"

          test -x "${TOOLCHAIN_DIR}/bin/x86_64-w64-mingw32-clang"
          test -x "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang"

          echo "x86_64 compiler:"
          "${TOOLCHAIN_DIR}/bin/x86_64-w64-mingw32-clang" --version

          echo "aarch64 compiler:"
          "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang" --version

      - name: Check Wine
        shell: bash
        run: |
          set -euo pipefail

          if command -v wine >/dev/null 2>&1; then
            WINE_PATH="$(command -v wine)"
            echo "Wine found at: ${WINE_PATH}"
            wine --version
            exit 0
          fi

          if [ -x "/opt/homebrew/bin/wine" ]; then
            echo "Wine found at /opt/homebrew/bin/wine"
            /opt/homebrew/bin/wine --version
            exit 0
          fi

          if [ -x "/usr/local/bin/wine" ]; then
            echo "Wine found at /usr/local/bin/wine"
            /usr/local/bin/wine --version
            exit 0
          fi

          echo "Wine is not installed."
          exit 1

      - name: Verify build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "macOS:"
          sw_vers

          echo "Architecture:"
          uname -m

          echo "Xcode:"
          xcodebuild -version

          echo "CMake:"
          cmake --version

          echo "Ninja:"
          ninja --version

          echo "LLVM MinGW:"
          toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin/x86_64-w64-mingw32-clang --version

          echo "Wine:"
          wine --version

      - name: Make build scripts executable
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build/*/build.sh

      - name: Build native components
        shell: bash
        run: |
          set -euxo pipefail

          for script in build/*/build.sh; do
            if [ -f "$script" ]; then
              echo "::group::Building $script"

              (
                cd "$(dirname "$script")"
                ./build.sh
              )

              echo "::endgroup::"
            fi
          done

      - name: Find Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          echo "Xcode projects found:"
          find . -maxdepth 4 -name "*.xcodeproj" -print

      - name: Build Madeira
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="$(find . -maxdepth 4 -name "*.xcodeproj" -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "No Xcode project found."
            exit 1
          fi

          echo "Using project: $PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate application
        id: find-app
        shell: bash
        run: |
          set -euxo pipefail

          APP_PATH="$(
            find "$HOME/Library/Developer/Xcode/DerivedData" \
              -type d \
              -path "*/Build/Products/Release-iphoneos/*.app" \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "Could not find the built .app bundle."
            exit 1
          fi

          echo "Found application: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package application
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          cp -R \
            "${{ steps.find-app.outputs.app_path }}" \
            artifacts/Madeira.app

          cd artifacts
          zip -r Madeira-ios.zip Madeira.app

      - name: Upload application
        uses: actions/upload-artifact@v6
        with:
          name: Madeira-iOS
          path: artifacts/Madeira-ios.zip
          if-no-files-found: error
