name: Build Madeira

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: madeira-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Madeira iOS
    runs-on: macos-15

    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      IOS_DEPLOYMENT_TARGET: "17.0"
      LLVM_MINGW_VERSION: "20260421"
      LLVM_MINGW_NAME: "llvm-mingw-20260421-ucrt-macos-universal"

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Homebrew dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            autoconf \
            automake \
            bison \
            cmake \
            flex \
            gettext \
            libtool \
            llvm \
            meson \
            nasm \
            ninja \
            pkg-config \
            python@3.13

          BISON_BIN="$(brew --prefix bison)/bin"
          FLEX_BIN="$(brew --prefix flex)/bin"
          LLVM_BIN="$(brew --prefix llvm)/bin"

          echo "${BISON_BIN}" >> "${GITHUB_PATH}"
          echo "${FLEX_BIN}" >> "${GITHUB_PATH}"
          echo "${LLVM_BIN}" >> "${GITHUB_PATH}"

      - name: Cache LLVM MinGW
        uses: actions/cache@v4
        with:
          path: toolchains/${{ env.LLVM_MINGW_NAME }}
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos-arm64

      - name: Install LLVM MinGW
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchains/${LLVM_MINGW_NAME}"
          TOOLCHAIN_ARCHIVE="${GITHUB_WORKSPACE}/toolchains/${LLVM_MINGW_NAME}.tar.xz"

          mkdir -p "${GITHUB_WORKSPACE}/toolchains"

          if [ ! -x "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang" ]; then
            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-all-errors \
              --show-error \
              --output "${TOOLCHAIN_ARCHIVE}" \
              "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_NAME}.tar.xz"

            tar \
              --extract \
              --xz \
              --file "${TOOLCHAIN_ARCHIVE}" \
              --directory "${GITHUB_WORKSPACE}/toolchains"

            rm -f "${TOOLCHAIN_ARCHIVE}"
          fi

          test -x "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang"
          test -x "${TOOLCHAIN_DIR}/bin/x86_64-w64-mingw32-clang"
          test -x "${TOOLCHAIN_DIR}/bin/ld.lld"

          echo "${TOOLCHAIN_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Export build environment
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchains/${LLVM_MINGW_NAME}"

          echo "BISON_BIN=$(brew --prefix bison)/bin" >> "${GITHUB_ENV}"
          echo "FLEX_BIN=$(brew --prefix flex)/bin" >> "${GITHUB_ENV}"
          echo "LLVM_BIN=$(brew --prefix llvm)/bin" >> "${GITHUB_ENV}"
          echo "LLVM_MINGW=${TOOLCHAIN_DIR}" >> "${GITHUB_ENV}"

          {
            echo "PATH=$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix llvm)/bin:${TOOLCHAIN_DIR}/bin:${PATH}"
          } >> "${GITHUB_ENV}"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "Architecture:"
          uname -m

          echo
          echo "Bison:"
          which bison
          bison --version

          echo
          echo "Flex:"
          which flex
          flex --version

          echo
          echo "Native Clang:"
          which clang
          clang --version

          echo
          echo "LLVM objcopy:"
          which llvm-objcopy
          llvm-objcopy --version

          echo
          echo "LLVM dlltool:"
          which llvm-dlltool

          echo
          echo "LLD:"
          which ld.lld
          ld.lld --version

          echo
          echo "AArch64 MinGW:"
          which aarch64-w64-mingw32-clang
          aarch64-w64-mingw32-clang --version

          echo
          echo "x86_64 MinGW:"
          which x86_64-w64-mingw32-clang
          x86_64-w64-mingw32-clang --version

      - name: Prepare Wine source tree
        shell: bash
        run: |
          set -euo pipefail

          test -f wine/configure
          test -f wine/dlls/ntdll/unix/sync.c
          test -f wine/dlls/ntdll/Makefile.in

          test -f build/ntdll-unix/shims/ios_srv_stats.h
          test -f build/ntdll-unix/shims/ios_spin_hist.h
          test -f build/ntdll-unix/shims/ios_frame_stats.h
          test -f build/ntdll-unix/shims/ios_fastsync.h
          test -f build/ntdll-unix/shims/ios_late_wake.h
          test -f build/ntdll-unix/shims/wine_ios_exit.h

          rm -rf wine/build-macos
          mkdir -p wine/build-macos

      - name: Patch Wine include paths for Madeira shims
        shell: bash
        run: |
          set -euo pipefail

          SHIMS_DIR="${GITHUB_WORKSPACE}/build/ntdll-unix/shims"
          MAKEFILE_IN="${GITHUB_WORKSPACE}/wine/dlls/ntdll/Makefile.in"

          test -d "${SHIMS_DIR}"
          test -f "${SHIMS_DIR}/ios_srv_stats.h"
          test -f "${MAKEFILE_IN}"

          if ! grep -Fq "${SHIMS_DIR}" "${MAKEFILE_IN}"; then
            sed -i.bak \
              "s|^EXTRAINCL = .*|EXTRAINCL = \$(TOMCRYPT_PE_CFLAGS) -I${SHIMS_DIR}|" \
              "${MAKEFILE_IN}"
          fi

          grep -n "^EXTRAINCL" "${MAKEFILE_IN}"

          echo
          echo "Madeira shim directory:"
          echo "${SHIMS_DIR}"

          echo
          echo "Required shim headers:"
          ls -1 \
            "${SHIMS_DIR}/ios_srv_stats.h" \
            "${SHIMS_DIR}/ios_spin_hist.h" \
            "${SHIMS_DIR}/ios_frame_stats.h" \
            "${SHIMS_DIR}/ios_fastsync.h" \
            "${SHIMS_DIR}/ios_late_wake.h" \
            "${SHIMS_DIR}/wine_ios_exit.h"

      - name: Configure Wine
        shell: bash
        working-directory: wine
        run: |
          set -euo pipefail

          REPO_ROOT="${GITHUB_WORKSPACE}"
          BUILD_DIR="${REPO_ROOT}/wine/build-macos"
          TOOLCHAIN_DIR="${REPO_ROOT}/toolchains/${LLVM_MINGW_NAME}"

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${LLVM_BIN}:\
          ${TOOLCHAIN_DIR}/bin:\
          ${PATH}"

          cd "${BUILD_DIR}"

          ../configure \
            --enable-win64 \
            --with-mingw \
            CC="${LLVM_BIN}/clang" \
            CXX="${LLVM_BIN}/clang++" \
            AR="${LLVM_BIN}/llvm-ar" \
            RANLIB="${LLVM_BIN}/llvm-ranlib" \
            DLLTOOL="${LLVM_BIN}/llvm-dlltool" \
            STRIP="${LLVM_BIN}/llvm-strip"

      - name: Verify Wine configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f wine/build-macos/Makefile
          test -f wine/build-macos/include/config.h
          test -x wine/build-macos/tools/makedep

          echo "Wine configuration completed successfully."

      - name: Build Wine tools
        shell: bash
        run: |
          set -euo pipefail

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          ${PATH}"

          cd wine/build-macos

          make -j"$(sysctl -n hw.ncpu)" \
            tools/makedep \
            tools/winebuild/winebuild \
            tools/winegcc/winegcc

      - name: Build Wine base components
        shell: bash
        run: |
          set -euo pipefail

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${LLVM_BIN}:\
          ${LLVM_MINGW}/bin:\
          ${PATH}"

          cd wine/build-macos

          make -j"$(sysctl -n hw.ncpu)" \
            server/libwineserver.a \
            dlls/d3dcompiler_47/d3dcompiler_47.dll \
            wine

      - name: Install Wine base library for Madeira
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/Madeira

          test -f wine/build-macos/server/libwineserver.a

          cp \
            wine/build-macos/server/libwineserver.a \
            app/Madeira/libwineserver.a

          ls -lh app/Madeira/libwineserver.a

      - name: Build FreeType iOS
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -x build/freetype-ios/build.sh ]; then
            chmod +x build/freetype-ios/build.sh
          fi

          ./build/freetype-ios/build.sh

      - name: Build ntdll Unix iOS layer
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/ntdll-unix/build.sh

          ./build/ntdll-unix/build.sh

          test -f app/Madeira/libntdll_unix.a

      - name: Build wineserver iOS layer
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/wineserver/build.sh

          ./build/wineserver/build.sh

          test -f app/Madeira/libwineserver.a

      - name: Build win32u Unix iOS layer
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/win32u-unix/build.sh

          ./build/win32u-unix/build.sh

          test -f app/Madeira/libwin32u_unix.a

      - name: Build DXMT iOS layer
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/dxmt-ios/build.sh

          ./build/dxmt-ios/build.sh

          test -f build/dxmt-ios/libdxmt_unix.a

      - name: Build D3D11 triangle
        shell: bash
        env:
          WINE: ${{ github.workspace }}/wine/build-macos/wine
        run: |
          set -euo pipefail

          chmod +x build/d3d11-triangle/build.sh

          test -x "${WINE}"
          test -x wine/build-macos/tools/winebuild/winebuild
          test -f wine/build-macos/dlls/d3dcompiler_47/d3dcompiler_47.dll

          "${WINE}" --version

          ./build/d3d11-triangle/build.sh

          test -f build/d3d11-triangle/triangle.exe

      - name: Prepare Xcode project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${GITHUB_WORKSPACE}/app/Madeira.xcodeproj"

          if [ ! -d "${PROJECT}" ]; then
            PROJECT="$(find "${GITHUB_WORKSPACE}/app" \
              -maxdepth 2 \
              -type d \
              -name "*.xcodeproj" \
              -print \
              -quit)"
          fi

          if [ -z "${PROJECT}" ] || [ ! -d "${PROJECT}" ]; then
            echo "Madeira Xcode project not found."
            exit 1
          fi

          echo "XCODE_PROJECT=${PROJECT}" >> "${GITHUB_ENV}"

      - name: Build Madeira iOS application
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${GITHUB_WORKSPACE}/DerivedData"

          xcodebuild \
            -project "${XCODE_PROJECT}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${GITHUB_WORKSPACE}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate application
        id: app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(
            find "${GITHUB_WORKSPACE}/DerivedData" \
              -type d \
              -path "*/Build/Products/Release-iphoneos/*.app" \
              -print \
              -quit
          )"

          if [ -z "${APP_PATH}" ]; then
            echo "Madeira.app was not found."
            exit 1
          fi

          echo "Found:"
          echo "${APP_PATH}"

          echo "app_path=${APP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts/Payload

          cp -R \
            "${{ steps.app.outputs.app_path }}" \
            artifacts/Payload/Madeira.app

          cd artifacts

          zip \
            -qry \
            Madeira-unsigned.ipa \
            Payload

          test -f Madeira-unsigned.ipa
          ls -lh Madeira-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Madeira-iOS
          path: artifacts/Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
