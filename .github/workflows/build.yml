name: Build Madeira

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: madeira-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Madeira iOS
    runs-on: macos-15

    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      IOS_DEPLOYMENT_TARGET: "17.0"

      LLVM_MINGW_VERSION: "20260421"
      LLVM_MINGW_NAME: "llvm-mingw-20260421-ucrt-macos-universal"
      GMP_VERSION: "6.3.0"
      NETTLE_VERSION: "3.10.1"
      GNUTLS_VERSION: "3.8.9"

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            autoconf \
            automake \
            bison \
            cmake \
            flex \
            gettext \
            libtool \
            llvm \
            meson \
            nasm \
            ninja \
            pkg-config \
            python@3.13

          BISON_BIN="$(brew --prefix bison)/bin"
          FLEX_BIN="$(brew --prefix flex)/bin"
          GETTEXT_BIN="$(brew --prefix gettext)/bin"
          LLVM_BIN="$(brew --prefix llvm)/bin"

          echo "${BISON_BIN}" >> "${GITHUB_PATH}"
          echo "${FLEX_BIN}" >> "${GITHUB_PATH}"
          echo "${GETTEXT_BIN}" >> "${GITHUB_PATH}"
          echo "${LLVM_BIN}" >> "${GITHUB_PATH}"

          echo "BISON_BIN=${BISON_BIN}" >> "${GITHUB_ENV}"
          echo "FLEX_BIN=${FLEX_BIN}" >> "${GITHUB_ENV}"
          echo "GETTEXT_BIN=${GETTEXT_BIN}" >> "${GITHUB_ENV}"
          echo "LLVM_BIN=${LLVM_BIN}" >> "${GITHUB_ENV}"

      - name: Cache LLVM MinGW
        uses: actions/cache@v4
        with:
          path: toolchains/${{ env.LLVM_MINGW_NAME }}
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos-arm64

      - name: Install LLVM MinGW
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_ROOT="${GITHUB_WORKSPACE}/toolchains"
          TOOLCHAIN_DIR="${TOOLCHAIN_ROOT}/${LLVM_MINGW_NAME}"
          TOOLCHAIN_ARCHIVE="${TOOLCHAIN_ROOT}/${LLVM_MINGW_NAME}.tar.xz"

          mkdir -p "${TOOLCHAIN_ROOT}"

          if [ ! -x "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang" ]; then
            rm -f "${TOOLCHAIN_ARCHIVE}"

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-all-errors \
              --show-error \
              --output "${TOOLCHAIN_ARCHIVE}" \
              "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_NAME}.tar.xz"

            tar \
              --extract \
              --xz \
              --file "${TOOLCHAIN_ARCHIVE}" \
              --directory "${TOOLCHAIN_ROOT}"

            rm -f "${TOOLCHAIN_ARCHIVE}"
          fi

          test -x "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang"
          test -x "${TOOLCHAIN_DIR}/bin/x86_64-w64-mingw32-clang"
          test -x "${TOOLCHAIN_DIR}/bin/llvm-dlltool"
          test -x "${TOOLCHAIN_DIR}/bin/ld.lld"

          echo "LLVM_MINGW=${TOOLCHAIN_DIR}" >> "${GITHUB_ENV}"
          echo "${TOOLCHAIN_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Configure common environment
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchains/${LLVM_MINGW_NAME}"

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${GETTEXT_BIN}:\
          ${LLVM_BIN}:\
          ${TOOLCHAIN_DIR}/bin:\
          ${PATH}"

          echo "PATH=${PATH}" >> "${GITHUB_ENV}"

          bison --version
          flex --version
          msgfmt --version

          xcrun clang --version
          "${LLVM_BIN}/clang" --version

          "${TOOLCHAIN_DIR}/bin/aarch64-w64-mingw32-clang" --version
          "${TOOLCHAIN_DIR}/bin/x86_64-w64-mingw32-clang" --version
          "${TOOLCHAIN_DIR}/bin/ld.lld" --version

      - name: Prepare LLVM headers for DXMT
        shell: bash
        run: |
          set -euo pipefail

          LLVM_PREFIX="$(brew --prefix llvm)"
          LLVM_SOURCE_INCLUDE="${LLVM_PREFIX}/include"
          LLVM_GENERATED_INCLUDE="$("${LLVM_PREFIX}/bin/llvm-config" --includedir)"

          mkdir -p \
            "${GITHUB_WORKSPACE}/toolchains/llvm-project/llvm" \
            "${GITHUB_WORKSPACE}/toolchains/llvm-ios-build"

          rm -rf \
            "${GITHUB_WORKSPACE}/toolchains/llvm-project/llvm/include" \
            "${GITHUB_WORKSPACE}/toolchains/llvm-ios-build/include"

          ln -s \
            "${LLVM_SOURCE_INCLUDE}" \
            "${GITHUB_WORKSPACE}/toolchains/llvm-project/llvm/include"

          ln -s \
            "${LLVM_GENERATED_INCLUDE}" \
            "${GITHUB_WORKSPACE}/toolchains/llvm-ios-build/include"

          test -f \
            "${GITHUB_WORKSPACE}/toolchains/llvm-project/llvm/include/llvm/ADT/StringRef.h"

          test -d \
            "${GITHUB_WORKSPACE}/toolchains/llvm-ios-build/include/llvm"

      - name: Prepare FreeType source
        shell: bash
        run: |
          set -euo pipefail

          FREETYPE_DIR="${GITHUB_WORKSPACE}/research/freetype"

          if [ ! -f "${FREETYPE_DIR}/CMakeLists.txt" ]; then
            rm -rf "${FREETYPE_DIR}"

            git clone \
              --depth 1 \
              --branch VER-2-13-3 \
              https://github.com/freetype/freetype.git \
              "${FREETYPE_DIR}"
          fi

          test -f "${FREETYPE_DIR}/CMakeLists.txt"

      - name: Build FreeType for iOS
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/freetype-ios/build.sh
          ./build/freetype-ios/build.sh

          test -f build/freetype-ios/build/libfreetype.a

      - name: Prepare GnuTLS source archives
        shell: bash
        run: |
          set -euo pipefail

          SRC_DIR="${GITHUB_WORKSPACE}/build/gnutls-ios/src"

          mkdir -p "${SRC_DIR}"

          download() {
            local url="$1"
            local output="$2"

            if [ ! -f "${SRC_DIR}/${output}" ]; then
              curl \
                --fail \
                --location \
                --retry 5 \
                --retry-all-errors \
                --show-error \
                --output "${SRC_DIR}/${output}" \
                "${url}"
            fi

            test -s "${SRC_DIR}/${output}"
          }

          download \
            "https://ftp.gnu.org/gnu/gmp/gmp-${GMP_VERSION}.tar.xz" \
            "gmp-${GMP_VERSION}.tar.xz"

          download \
            "https://ftp.gnu.org/gnu/nettle/nettle-${NETTLE_VERSION}.tar.gz" \
            "nettle-${NETTLE_VERSION}.tar.gz"

          download \
            "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-${GNUTLS_VERSION}.tar.xz" \
            "gnutls-${GNUTLS_VERSION}.tar.xz"

      - name: Build GnuTLS for iOS
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/gnutls-ios/build.sh
          ./build/gnutls-ios/build.sh

          test -f toolchains/gnutls-ios/lib/libgmp.a
          test -f toolchains/gnutls-ios/lib/libnettle.a
          test -f toolchains/gnutls-ios/lib/libhogweed.a
          test -f toolchains/gnutls-ios/lib/libgnutls.a

      - name: Prepare Wine Madeira headers
        shell: bash
        run: |
          set -euo pipefail

          SHIMS_DIR="${GITHUB_WORKSPACE}/build/ntdll-unix/shims"
          WINE_NTDLL_UNIX="${GITHUB_WORKSPACE}/wine/dlls/ntdll/unix"

          test -d "${SHIMS_DIR}"
          test -d "${WINE_NTDLL_UNIX}"

          for header in "${SHIMS_DIR}"/*.h; do
            name="$(basename "${header}")"
            ln -sfn "${header}" "${WINE_NTDLL_UNIX}/${name}"
          done

      - name: Verify native macOS compiler
        shell: bash
        run: |
          set -euo pipefail

          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          TEST_DIR="${RUNNER_TEMP}/clang-test"

          rm -rf "${TEST_DIR}"
          mkdir -p "${TEST_DIR}"

          cat > "${TEST_DIR}/main.c" <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          "${LLVM_BIN}/clang" \
            -isysroot "${SDKROOT}" \
            "${TEST_DIR}/main.c" \
            -o "${TEST_DIR}/test"

          file "${TEST_DIR}/test"
          test -x "${TEST_DIR}/test"

      - name: Configure Wine
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchains/${LLVM_MINGW_NAME}"
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${GETTEXT_BIN}:\
          ${LLVM_BIN}:\
          ${TOOLCHAIN_DIR}/bin:\
          ${PATH}"

          export SDKROOT

          rm -rf wine/build-macos
          mkdir -p wine/build-macos

          cd wine/build-macos

          ../configure \
            --enable-win64 \
            --with-mingw \
            CC="${LLVM_BIN}/clang" \
            CXX="${LLVM_BIN}/clang++" \
            AR="${LLVM_BIN}/llvm-ar" \
            RANLIB="${LLVM_BIN}/llvm-ranlib" \
            STRIP="${LLVM_BIN}/llvm-strip" \
            DLLTOOL="${LLVM_BIN}/llvm-dlltool"

          test -f Makefile
          test -f include/config.h

      - name: Build Wine tools and runtime
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchains/${LLVM_MINGW_NAME}"

          export PATH="\
          ${BISON_BIN}:\
          ${FLEX_BIN}:\
          ${GETTEXT_BIN}:\
          ${LLVM_BIN}:\
          ${TOOLCHAIN_DIR}/bin:\
          ${PATH}"

          cd wine/build-macos

          make -j"$(sysctl -n hw.ncpu)" \
            tools/makedep \
            tools/winebuild/winebuild \
            tools/winegcc/winegcc \
            server/libwineserver.a \
            dlls/d3dcompiler_47/d3dcompiler_47.dll \
            wine

      - name: Build ntdll Unix iOS layer
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/ntdll-unix/build.sh
          ./build/ntdll-unix/build.sh

          test -f app/Madeira/libntdll_unix.a

      - name: Build wineserver iOS layer
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/wineserver/build.sh
          ./build/wineserver/build.sh

          test -f app/Madeira/libwineserver.a

      - name: Build win32u Unix iOS layer
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/win32u-unix/build.sh
          ./build/win32u-unix/build.sh

          test -f app/Madeira/libwin32u_unix.a

      - name: Build DXMT iOS layer
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/dxmt-ios/build.sh
          ./build/dxmt-ios/build.sh

          test -f build/dxmt-ios/libdxmt_unix.a

      - name: Build D3D11 shader test assets
        shell: bash
        env:
          WINE: ${{ github.workspace }}/wine/build-macos/wine
        run: |
          set -euo pipefail

          chmod +x build/d3d11-triangle/build.sh

          test -x "${WINE}"
          test -x wine/build-macos/tools/winebuild/winebuild
          test -f wine/build-macos/dlls/d3dcompiler_47/d3dcompiler_47.dll

          "${WINE}" --version

          ./build/d3d11-triangle/build.sh

          test -s build/d3d11-triangle/vs.dxbc
          test -s build/d3d11-triangle/ps.dxbc
          test -s build/d3d11-triangle/vs_dxbc.h
          test -s build/d3d11-triangle/ps_dxbc.h

      - name: Prepare Madeira Xcode build
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "${GITHUB_WORKSPACE}/app/Madeira.xcodeproj" ]; then
            echo "XCODE_PROJECT=${GITHUB_WORKSPACE}/app/Madeira.xcodeproj" >> "${GITHUB_ENV}"
          else
            PROJECT="$(
              find "${GITHUB_WORKSPACE}/app" \
                -maxdepth 3 \
                -type d \
                -name "*.xcodeproj" \
                -print \
                -quit
            )"

            if [ -z "${PROJECT}" ]; then
              echo "No Xcode project found in app/."
              exit 1
            fi

            echo "XCODE_PROJECT=${PROJECT}" >> "${GITHUB_ENV}"
          fi

      - name: Build Madeira iOS application
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${GITHUB_WORKSPACE}/DerivedData"

          xcodebuild \
            -project "${XCODE_PROJECT}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${GITHUB_WORKSPACE}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate Madeira.app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(
            find "${GITHUB_WORKSPACE}/DerivedData" \
              -type d \
              -path "*/Build/Products/Release-iphoneos/*.app" \
              -print \
              -quit
          )"

          if [ -z "${APP_PATH}" ]; then
            echo "Madeira.app was not produced."
            exit 1
          fi

          echo "app_path=${APP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts/Payload

          cp -R \
            "${{ steps.app.outputs.app_path }}" \
            artifacts/Payload/Madeira.app

          cd artifacts

          zip \
            -qry \
            Madeira-unsigned.ipa \
            Payload

          test -s Madeira-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Madeira-iOS
          path: artifacts/Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
